# wallust v4 — palette generator left near defaults. Per-consumer slot choice
# (Colors.qml, starship.toml.base, niri-colors.sh, fastfetch-launcher.sh)
# decides which slot to use where, instead of brute-forcing readability into
# every slot via aggressive saturation/contrast knobs.

backend = "fastresize"
palette = "salience"
salience = { sampling = "balanced", intensity = "normal" }
style = "dark"

[templates]
colors_rofi = { template = "colors-rofi-dark.rasi", target = "~/.cache/wal/colors-rofi-dark.rasi" }
colors_kitty = { template = "colors-kitty.conf", target = "~/.cache/wal/colors-kitty.conf" }
colors_json = { template = "colors.json", target = "~/.cache/wal/colors.json" }

[hooks]
starship_colors = "$HOME/.config/scripts/starship-color-gen.sh"
niri_colors = "$HOME/.config/scripts/pywal-niri-colors.sh"
kitty_reload = "pkill -USR1 -x kitty 2>/dev/null; true"
