<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    The Quickshell shell sets every Text to the "Inter" family (proportional,
    macOS-like). Icon Texts put Nerd Font glyphs (Unicode Private Use Area) on
    that SAME family. Inter has no PUA coverage, so append JetBrainsMono Nerd
    Font as a fallback: Latin/numerals render from Inter, glyph icons fall back
    to the Nerd Font. One family token, both jobs — no per-Text icon family.
  -->
  <match target="pattern">
    <test name="family"><string>Inter</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>
</fontconfig>
